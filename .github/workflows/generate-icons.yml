on:
  workflow_dispatch:
  push:
    branches:
      - pull-icons

name: Generate Frosted Icons from Figma

concurrency:
  group: 'generate-icons'
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-icons:
    name: Generate icons from Figma and commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          path: swift-repo

      - name: Clone frosted-ui repo
        uses: actions/checkout@v4
        with:
          repository: whopio/frosted-ui
          token: ${{ secrets.GITHUB_TOKEN }}
          path: frosted-ui

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          check-latest: true

      - name: Install dependencies
        run: pnpm i
        working-directory: ./frosted-ui

      - name: Generate icons from Figma
        run: pnpm generate-src
        working-directory: ./frosted-ui/packages/frosted-ui-icons
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}

      - name: Deduplicate source SVGs in zip
        run: |
          set -euo pipefail
          ZIP_PATH="frosted-ui/packages/frosted-ui-icons/frosted-ui-icons.zip"
          TEMP_DIR=$(mktemp -d)
          
          echo "Extracting zip..."
          unzip -q "$ZIP_PATH" -d "$TEMP_DIR"
          
          cd "$TEMP_DIR"
          
          # === 1. Remove case-insensitive duplicates ===
          # e.g., tik-tok-12.svg vs tiktok-12.svg -> keep the hyphenated one (more chars)
          declare -A seen
          declare -A to_keep
          
          for svg in *.svg; do
            [ -f "$svg" ] || continue
            lower=$(echo "$svg" | tr '[:upper:]' '[:lower:]')
            
            if [ -z "${seen[$lower]:-}" ]; then
              seen[$lower]="$svg"
              to_keep[$lower]="$svg"
            else
              existing="${to_keep[$lower]}"
              # Keep the longer filename (hyphenated version has more chars)
              if [ ${#svg} -gt ${#existing} ]; then
                to_keep[$lower]="$svg"
              fi
              seen[$lower]="${seen[$lower]}:$svg"
            fi
          done
          
          for lower in "${!seen[@]}"; do
            IFS=':' read -ra files <<< "${seen[$lower]}"
            keep="${to_keep[$lower]}"
            for f in "${files[@]}"; do
              if [ "$f" != "$keep" ] && [ -f "$f" ]; then
                echo "Removing case-variant duplicate: $f (keeping $keep)"
                rm -f "$f"
              fi
            done
          done
          
          # === 2. Remove *-size-* suffix duplicates ===
          # e.g., arrow-down-to-line-size-12.svg is duplicate of arrow-down-to-line-12.svg
          for svg in *-size-*.svg; do
            [ -f "$svg" ] || continue
            # Remove "-size" from the name to get the base version
            base_svg=$(echo "$svg" | sed 's/-size-/-/')
            if [ -f "$base_svg" ]; then
              echo "Removing Size suffix duplicate: $svg (base version $base_svg exists)"
              rm -f "$svg"
            fi
          done
          
          echo "Re-creating zip..."
          cd "$TEMP_DIR"
          rm -f "$GITHUB_WORKSPACE/$ZIP_PATH"
          zip -q "$GITHUB_WORKSPACE/$ZIP_PATH" *.svg
          
          rm -rf "$TEMP_DIR"
          echo "Deduplication complete."

      - name: Clear existing generated icons
        run: |
          set -euo pipefail

          # Clear generated asset contents (preserve the asset catalog root Contents.json if present)
          if [ -d "Sources/FrostedUI/Resources/Icons.xcassets" ]; then
            find "Sources/FrostedUI/Resources/Icons.xcassets" -mindepth 1 -maxdepth 1 ! -name "Contents.json" -exec rm -rf {} +
          fi

          # Clear generated Swift icon files
          rm -rf "Sources/FrostedUI/Icons"
          mkdir -p "Sources/FrostedUI/Icons"
        working-directory: ./swift-repo

      - name: Process icons into xcassets
        run: bash ./bin/generate_frosted_icons.sh $GITHUB_WORKSPACE/frosted-ui/packages/frosted-ui-icons/frosted-ui-icons.zip
        working-directory: ./swift-repo

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update icons from Figma"
          file_pattern: "Sources/FrostedUI/Resources/Icons.xcassets/** Sources/FrostedUI/Icons/**"
          repository: ./swift-repo
