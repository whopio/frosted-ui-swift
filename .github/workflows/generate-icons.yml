on:
  workflow_dispatch:
  push:
    branches:
      - fix/ci-generation

name: Generate Frosted Icons from Figma

concurrency:
  group: "generate-icons"
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-icons:
    name: Generate icons from Figma and commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          path: swift-repo

      - name: Clone frosted-ui repo
        uses: actions/checkout@v4
        with:
          repository: whopio/frosted-ui
          token: ${{ secrets.GITHUB_TOKEN }}
          path: frosted-ui

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          check-latest: true

      - name: Install dependencies
        run: pnpm i
        working-directory: ./frosted-ui

      - name: Generate icons from Figma
        run: pnpm generate-src
        working-directory: ./frosted-ui/packages/frosted-ui-icons
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}

      - name: Deduplicate source SVGs in zip
        run: |
          set -euo pipefail
          ZIP_PATH="frosted-ui/packages/frosted-ui-icons/frosted-ui-icons.zip"
          TEMP_DIR=$(mktemp -d)

          echo "Extracting zip..."
          unzip -q "$ZIP_PATH" -d "$TEMP_DIR"

          cd "$TEMP_DIR"

          # Function to compute imageset name from SVG filename
          # e.g., tik-tok-12.svg -> tiktok12 (lowercase for comparison)
          get_imageset_key() {
            local svg="$1"
            local name="${svg%.svg}"           # remove .svg
            local size="${name##*-}"           # extract size (last segment after -)
            local base="${name%-*}"            # remove size suffix
            # Convert kebab-case to camelCase, then lowercase for comparison
            local camel=$(echo "$base" | awk -F'-' '{ for (i=1;i<=NF;i++) { if (i==1) printf "%s", $i; else printf "%s%s", toupper(substr($i,1,1)), substr($i,2); } }')
            echo "${camel}${size}" | tr '[:upper:]' '[:lower:]'
          }

          # === 1. Remove duplicates that produce same imageset name ===
          # e.g., tik-tok-12.svg -> tikTok12, tiktok-12.svg -> tiktok12
          # Both lowercase to tiktok12, so they're duplicates on case-insensitive FS
          declare -A seen
          declare -A to_keep

          for svg in *.svg; do
            [ -f "$svg" ] || continue
            key=$(get_imageset_key "$svg")

            if [ -z "${seen[$key]:-}" ]; then
              seen[$key]="$svg"
              to_keep[$key]="$svg"
            else
              existing="${to_keep[$key]}"
              # Keep the longer filename (more hyphens = more specific naming)
              if [ ${#svg} -gt ${#existing} ]; then
                to_keep[$key]="$svg"
              fi
              seen[$key]="${seen[$key]}:$svg"
            fi
          done

          for key in "${!seen[@]}"; do
            IFS=':' read -ra files <<< "${seen[$key]}"
            keep="${to_keep[$key]}"
            for f in "${files[@]}"; do
              if [ "$f" != "$keep" ] && [ -f "$f" ]; then
                echo "Removing duplicate: $f (keeping $keep, both map to imageset '$key')"
                rm -f "$f"
              fi
            done
          done

          # === 2. Remove all *-size-* icons (they're duplicates we don't need) ===
          for svg in *-size-*.svg; do
            [ -f "$svg" ] || continue
            echo "Removing Size variant: $svg"
            rm -f "$svg"
          done

          echo "Re-creating zip..."
          rm -f "$GITHUB_WORKSPACE/$ZIP_PATH"
          zip -q "$GITHUB_WORKSPACE/$ZIP_PATH" *.svg

          rm -rf "$TEMP_DIR"
          echo "Deduplication complete."

      - name: Clear existing generated icons
        run: |
          set -euo pipefail

          # Clear generated asset contents (preserve the asset catalog root Contents.json if present).
          # Only Icons.xcassets is touched — non-icon assets belong in Other.xcassets so they
          # are never wiped by this workflow.
          if [ -d "Sources/FrostedUI/Resources/Icons.xcassets" ]; then
            find "Sources/FrostedUI/Resources/Icons.xcassets" -mindepth 1 -maxdepth 1 ! -name "Contents.json" -exec rm -rf {} +
          fi

          # Only the generated Icon+Extensions.swift is removed. Other Swift files in
          # Sources/FrostedUI/Icons/ (e.g. FrostedIconSet.swift, AIBall.swift) are
          # hand-maintained and must not be deleted by this workflow.
          mkdir -p "Sources/FrostedUI/Icons"
          rm -f "Sources/FrostedUI/Icons/Icon+Extensions.swift"
        working-directory: ./swift-repo

      - name: Process icons into xcassets
        run: bash ./bin/generate_frosted_icons.sh $GITHUB_WORKSPACE/frosted-ui/packages/frosted-ui-icons/frosted-ui-icons.zip
        working-directory: ./swift-repo

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          path: ./swift-repo
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update icons from Figma"
          branch: chore/update-icons-from-figma
          delete-branch: true
          title: "chore: update icons from Figma"
          body: |
            This PR updates the icons from Figma.

            Auto-generated by the Generate Frosted Icons workflow.
          add-paths: |
            Sources/FrostedUI/Resources/Icons.xcassets/**
            Sources/FrostedUI/Icons/Icon+Extensions.swift
