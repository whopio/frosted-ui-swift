name: Sync Frosted Pictograms

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/generate-pictograms.yml
      - bin/generate_frosted_brand_assets.sh
      - bin/generate_brand_asset_extensions.sh
      - Sources/FrostedUI/BrandAssets/**
      - Sources/FrostedUI/Resources/BrandAssets.xcassets/**

concurrency:
  group: sync-pictograms-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-pictograms:
    name: Generate pictograms from frosted-ui
    runs-on: ubuntu-latest

    steps:
      - name: Check out frosted-ui-swift
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: swift-repo

      - name: Check out pictogram source
        uses: actions/checkout@v7
        with:
          repository: whopio/frosted-ui
          ref: main
          path: frosted-ui

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate pictograms
        working-directory: swift-repo
        run: bash ./bin/generate_frosted_brand_assets.sh "$GITHUB_WORKSPACE/frosted-ui/packages/frosted-ui-icons/pictograms"

      - name: Validate generated files
        working-directory: swift-repo
        run: |
          set -euo pipefail
          git diff --check

          case_count=$(grep -c '^    case ' Sources/FrostedUI/BrandAssets/BrandAsset+Extensions.swift)
          imageset_count=$(find Sources/FrostedUI/Resources/BrandAssets.xcassets -mindepth 1 -maxdepth 1 -type d -name '*.imageset' | wc -l)

          test "$case_count" -gt 0
          test "$imageset_count" -eq "$case_count"

          find Sources/FrostedUI/Resources/BrandAssets.xcassets -name Contents.json -print0 \
            | xargs -0 -n1 python3 -m json.tool >/dev/null

      - name: Verify pull request output is current
        if: github.event_name == 'pull_request'
        working-directory: swift-repo
        run: |
          generated_status=$(
            git status --porcelain -- \
              Sources/FrostedUI/BrandAssets \
              Sources/FrostedUI/Resources/BrandAssets.xcassets
          )
          if [ -n "$generated_status" ]; then
            echo "Generated pictograms do not match the committed files."
            echo "$generated_status"
            exit 1
          fi

      - name: Create pictogram update pull request
        if: github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@v8
        with:
          path: swift-repo
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update pictograms from frosted-ui"
          branch: chore/update-pictograms-from-frosted-ui
          delete-branch: true
          draft: true
          title: "chore: update pictograms from frosted-ui"
          body: |
            This PR updates the Swift pictogram assets from the committed SVGs in
            `whopio/frosted-ui/packages/frosted-ui-icons/pictograms`.

            Auto-generated by the Sync Frosted Pictograms workflow.
          add-paths: |
            Sources/FrostedUI/Resources/BrandAssets.xcassets/**
            Sources/FrostedUI/BrandAssets/BrandAsset+Extensions.swift
